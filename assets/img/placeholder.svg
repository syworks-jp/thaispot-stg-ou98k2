  </g>

  <circle cx="200" cy="150" r="86" fill="none" stroke="#eadfc6" stroke-width="1.5" stroke-dasharray="3 5"/>

  <text x="200" y="262" text-anchor="middle" font-family="Georgia, 'Yu Mincho', 'Hiragino Mincho ProN', serif" font-size="15" fill="#a83226" letter-spacing="1">THAI SPOT TOKYO</text>
  <text x="200" y="280" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic UI',sans-serif" font-size="11" fill="#8a8378">Photo Coming Soon</text>
